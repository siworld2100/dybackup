org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 工程当前位于 D:\dev\douyin-downloader-app（纯 ASCII 路径），无需再跳过检查。
# 保留该开关是为了兼容从旧路径（含「编码空间」中文目录）直接构建的场景。
android.overridePathCheck=true

# 关闭 Kotlin 增量编译。
# 原因：Flutter 插件的 .kt 源码位于用户目录下的 Pub 缓存（如 %LOCALAPPDATA%\Pub\Cache），
# 而工程可能位于 D: 盘。Kotlin 增量缓存用 relativeTo() 计算相对路径，跨盘符会抛
# 「this and base files have different roots」导致 compileReleaseKotlin 失败。
# 关闭增量后走全量编译，稳定但略慢，对本工程影响可忽略。
kotlin.incremental=false
